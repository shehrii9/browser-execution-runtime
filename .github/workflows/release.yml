name: Release

# Publishes when you push a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# Required repo secret: NPM_TOKEN
# Optional repo secret: PYPI_TOKEN

on:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++
          npm rebuild better-sqlite3 --build-from-source
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    needs: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + maybe publish Python client
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install build twine
          python -m build
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_TOKEN not set — skipping upload (built sdist/wheel only)"
            exit 0
          fi
          python -m twine upload dist/*

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust core
        run: cargo test -p ber-core
      - name: Build ber-core release binary
        run: cargo build -p ber-core --release
      - name: Upload ber-core artifact
        uses: actions/upload-artifact@v4
        with:
          name: ber-core-${{ github.ref_name }}
          path: target/release/ber-core
