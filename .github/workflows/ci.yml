name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++
          npm rebuild better-sqlite3 --build-from-source
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Build
        run: npm run build
      - name: Pack check
        run: npm run pack:check

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test ber-core
        run: cargo test -p ber-core
      - name: Build ber-core
        run: cargo build -p ber-core

  # Single gate for branch protection (easier to find than individual jobs in the UI).
  all:
    name: all
    runs-on: ubuntu-latest
    needs: [test, rust]
    if: always()
    steps:
      - name: Require test and rust
        run: |
          echo "test=${{ needs.test.result }} rust=${{ needs.rust.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.rust.result }}" != "success" ]; then
            exit 1
          fi
