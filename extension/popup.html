<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BER Debug Bridge</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f1e8;
        --ink: #1d1a16;
        --accent: #0f6b5c;
        --line: #d7cfc0;
      }
      body {
        margin: 0;
        font: 13px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fff7e8, transparent 45%),
          linear-gradient(180deg, #f8f3ea, #efe6d8);
        width: 320px;
        padding: 14px;
      }
      h1 {
        margin: 0 0 4px;
        font: 700 16px/1.2 "Fraunces", Georgia, serif;
      }
      p {
        margin: 0 0 12px;
        color: #5b5348;
      }
      label {
        display: block;
        margin: 0 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
        background: #fffdf8;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 9px 10px;
        margin-bottom: 8px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #2d2a26;
      }
      pre {
        white-space: pre-wrap;
        background: #fffdf8;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        max-height: 160px;
        overflow: auto;
        margin: 0;
      }
      .ok { color: #0f6b5c; }
      .bad { color: #9b2c2c; }
    </style>
  </head>
  <body>
    <h1>BER Bridge</h1>
    <p>Debug attach only. The model stays outside the browser.</p>
    <label for="daemon">Daemon URL</label>
    <input id="daemon" value="http://127.0.0.1:8787" />
    <button id="ping">Check daemon</button>
    <button id="observe" class="secondary">Observe current tab URL</button>
    <button id="attach">Attach runtime to this URL</button>
    <pre id="out">Ready.</pre>
    <script src="popup.js" type="module"></script>
  </body>
</html>
