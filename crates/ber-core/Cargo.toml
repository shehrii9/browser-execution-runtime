[package]
name = "ber-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust core helpers for Browser Execution Runtime (fingerprint + hashing embeddings)"
readme = "README.md"

[lib]
name = "ber_core"
path = "src/lib.rs"

[[bin]]
name = "ber-core"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
