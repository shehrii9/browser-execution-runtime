<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DOM mutate fixture</title>
  </head>
  <body>
    <h1>Mutate test</h1>
    <script>
      setTimeout(function () {
        var d = document.createElement("div");
        d.id = "injected";
        d.textContent = "injected";
        document.body.appendChild(d);
      }, 1200);
    </script>
  </body>
</html>
